              <div class="app-container container-xxl pb-10">

                <label class="form-cheak-label">

                    type="radio"
                    name="toggle_item_01"
                    data-toggle="toggle_01"

                <label class="form-cheak-label">
                  <input
                    class="form-check-input"
                    type="radio"

                    data-toggle="toggle_02"
                    onclick="toggleChoice('toggle_item_01')"
                    checked=""
                  />啟用限制

                <div class="radio_con toggle_02">
                  <!--page_toolbar start-->

                    <div class="d-flex flex-wrap flex-stack">

                            <i class="fa-solid fa-magnifying-glass"></i>

                          <button
                            type="submit"
                            class="btn btn-success"
                            title="新增"
                            data-bs-toggle="modal"
                            data-bs-target="#edit_modal"
                          >
                            <i class="fa-solid fa-plus"></i>
                          </button>
                          <button
                            type="submit"
                            class="btn btn-danger"
                            title="刪除"
                          >
                            <i class="fa-solid fa-trash-can"></i>
                          </button>
                        </div>
                      </div>
                      <!--page_btn end-->
                    </div>
                  </div>
                  <!--page_toolbar end-->

                  <!--page_search start-->
                  <div class="page_search search_con">
                    <div class="form_table rounded border border-gray-300">
                      <div class="row">
                        <div class="col-md-2 col-form-label">單位名稱</div>
                        <div class="col-md-4 form_font">
                          <input type="text" class="form-control" />
                        </div>
                        <div class="col-md-2 col-form-label">啟用狀態</div>
                        <div class="col-md-4 form_font">
                          <select class="form-control w-auto form-select">
                            <option value="#">全部</option>

                    </div>
                    <div class="btn_box pb-0">

                      <button

                        搜尋

                  </div>

                        <thead>
                          <tr class="fw-bold">

                            </th>
                            <th>單位名稱</th>
                            <th>IP位置</th>
                            <th>開始日期</th>
                            <th>結束日期</th>

                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td class="text-center">
                              <input class="form-check-input" type="checkbox" />
                            </td>
                            <td>
                              <a
                                href="#"
                                data-bs-toggle="modal"
                                data-bs-target="#edit_modal"
                                >*雷普科技</a
                              >
                            </td>
                            <td>127.0.0.1</td>
                            <td></td>
                            <td></td>
                            <td>正常</td>
                            <td class="text-center">
                              <input
                                class="form-check-input"
                                type="checkbox"
                                checked
                              />
                            </td>
                          </tr>
                          <tr>
                            <td class="text-center">
                              <input class="form-check-input" type="checkbox" />
                            </td>
                            <td>
                              <a
                                href="#"
                                data-bs-toggle="modal"
                                data-bs-target="#edit_modal"
                                >雷普科技</a
                              >
                            </td>
                            <td>192.168.0.1</td>
                            <td></td>
                            <td></td>
                            <td>正常</td>
                            <td class="text-center">
                              <input
                                class="form-check-input"
                                type="checkbox"
                                checked
                              />
                            </td>
                          </tr>
                          <tr class="disabled">
                            <td class="text-center">
                              <input class="form-check-input" type="checkbox" />
                            </td>
                            <td>
                              <a
                                href="#"
                                data-bs-toggle="modal"
                                data-bs-target="#edit_modal"
                                >雷普科技</a
                              >
                            </td>
                            <td>127.0.0.1</td>
                            <td>2024/01/01</td>
                            <td>2026/01/01</td>
                            <td>過期</td>
                            <td class="text-center">
                              <input
                                class="form-check-input"
                                type="checkbox"
                                disabled
                              />
                            </td>

    <!-- Modal start-->
    <div
      class="modal fade"
      id="edit_modal"
      tabindex="-1"
      aria-labelledby="edit_label"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <div class="modal-title" id="edit_label">編輯IP限制</div>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="page_group w-105">
              <label class="item">
                <div class="title required">單位名稱</div>
                <div class="input_font input-auto">
                  <input type="text" class="form-control" />
                </div>
              </label>
              <label class="item">
                <div class="title required">IP位置</div>
                <div class="input_font input-auto">
                  <input type="text" class="form-control" />
                </div>
              </label>
              <label class="item">
                <div class="title">使用期限</div>
                <div class="input_font input-auto">
                  <label class="form-cheak-label">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="toggle_item_02"
                      data-toggle="toggle_02_01"
                      onclick="toggleChoice('toggle_item_02')"
                      checked=""
                    />無限期
                  </label>
                  <label class="form-cheak-label">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="toggle_item_02"
                      data-toggle="toggle_02_02"
                      onclick="toggleChoice('toggle_item_02')"
                    />有
                  </label>
                  <span class="d-inline-block">
                    <div class="toggle_02_02" style="display: none">
                      <div class="date-range">
                        <input
                          type="date"
                          class="form-control w-125px d-inline-block"
                        />
                        <div class="d-inline-block">~</div>
                        <input
                          type="date"
                          class="form-control w-125px d-inline-block"
                        />
                        <button
                          class="btn btn-secondary btn_clear fs-4"
                          title="清空"
                        >
                          <i class="ki-solid ki-cross fs-2"></i>
                        </button>
                      </div>

                      <script>
                        document
                          .querySelectorAll(".btn_clear")
                          .forEach((button) => {
                            button.addEventListener("click", function () {
                              const parent = this.closest(".date-range"); // 找到外層容器
                              const inputs =
                                parent.querySelectorAll('input[type="date"]');
                              inputs.forEach((input) => (input.value = "")); // 清空值
                            });
                          });
                      </script>
                    </div>
                  </span>
                </div>
              </label>
              <label class="item">
                <div class="title required">備註</div>
                <div class="input_font input-auto">
                  <textarea class="form-control" rows="3"></textarea>
                </div>
              </label>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              取消
            </button>
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              確認
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal end-->
