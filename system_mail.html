<!doctype html>
<html lang="zh-hant-tw">
  <head>
    <title>TaiPlay後台管理系統</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="img/favicon.ico" />
    <link href="css/datatables.bundle.css" rel="stylesheet" type="text/css" />
    <link href="css/plugins.bundle.css" rel="stylesheet" type="text/css" />
    <link href="css/style.bundle.css" rel="stylesheet" type="text/css" />
    <link href="scss/style.css" rel="stylesheet" type="text/css" />
    <!--font icon-->
    <link rel="stylesheet" href="css/all.min.css" />

    <script src="js/jquery.min.js"></script>
    <script src="js/main.js"></script>
  </head>

  <body
    id="kt_app_body"
    data-kt-app-layout="dark-sidebar"
    data-kt-app-header-fixed="true"
    data-kt-app-sidebar-enabled="true"
    data-kt-app-sidebar-fixed="true"
    data-kt-app-sidebar-hoverable="true"
    data-kt-app-sidebar-push-header="true"
    data-kt-app-sidebar-push-toolbar="true"
    data-kt-app-sidebar-push-footer="true"
    data-kt-app-toolbar-enabled="true"
    class="app-default body_color_01 left_menu_bg"
  >
    <div class="d-flex flex-column flex-root app-root" id="kt_app_root">
      <div class="app-page flex-column flex-column-fluid" id="kt_app_page">
        <!--header start-->
        <script>
          $.include("blocks/header.html");
        </script>
        <!--header end-->

        <div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
          <!--left menu start-->
          <script>
            $.include("blocks/left_menu.html");
          </script>
          <!--left menu end-->

          <!--main_con start-->
          <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
            <div class="d-flex flex-column flex-column-fluid">
              <!--main content start-->

              <!--page_title star-->
              <div id="kt_app_toolbar" class="app-toolbar py-3">
                <div
                  id="kt_app_toolbar_container"
                  class="app-container container-xxl d-flex flex-stack"
                >
                  <!--title start-->
                  <div
                    class="page-title d-flex flex-column justify-content-center flex-wrap me-3"
                  >
                    <!--breadcrumb start-->
                    <ul class="breadcrumb breadcrumb-separatorless my-0 py-1">
                      <li class="breadcrumb-item">
                        <a href="index.html">首頁</a>
                      </li>
                      <li class="breadcrumb-item">系統管理</li>
                    </ul>
                    <!--breadcrumb end-->

                    <h2 class="page-heading d-flex my-0">
                      郵件主機設定
                      <div
                        class="form-check form-switch form-check-solid dispaly-inline-block pt-3 ms-2"
                      >
                        <!-- <input class="form-check-input status-popover-input3" type="checkbox" data-bs-placement="bottom" data-bs-toggle="popover" data-bs-trigger="hover" data-bs-html="true" data-bs-content="唯讀"> -->
                        <input
                          type="checkbox"
                          class="form-check-input status-popover-toggle status-popover-input3"
                          data-on="編輯開啟"
                          data-off="唯讀"
                          data-bs-placement="bottom"
                          data-bs-toggle="popover"
                          data-bs-trigger="hover"
                          data-bs-html="true"
                          data-bs-content="唯讀"
                        />
                      </div>
                    </h2>
                  </div>
                  <!--title end-->
                </div>
              </div>
              <!--page_title end-->

              <div class="app-container container-xxl pb-10">
                <!--form_table start-->
                <div class="form_table rounded border border-gray-300">
                  <div class="row">
                    <div class="col-md-2 col-form-label required">Host</div>
                    <div class="col-md-10 form_font">
                      <div class="onlyread_text">smtp.gmail.com</div>
                      <input
                        type="text"
                        class="form-control d-none"
                        value="smtp.gmail.com"
                      />
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label required">Port</div>
                    <div class="col-md-10 form_font">
                      <div class="onlyread_text">578</div>
                      <input
                        type="text"
                        class="form-control d-none"
                        value="587"
                      />
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label required">SSL</div>
                    <div class="col-md-10 form_font">
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          checked
                          disabled
                        />
                      </label>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label required">登入帳號</div>
                    <div class="col-md-10 form_font">
                      <div class="onlyread_text">service@laypu.com</div>
                      <input
                        type="text"
                        class="form-control d-none"
                        value="service@laypu.com"
                      />
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label required">登入密碼</div>
                    <div class="col-md-10 form_font">
                      <div class="onlyread_text">pfljacwgbpdfllbi</div>
                      <input
                        type="text"
                        class="form-control d-none"
                        value="pfljacwgbpdfllbi"
                      />
                    </div>
                  </div>
                </div>
                <div class="btn_box pb-0">
                  <button
                    type="submit"
                    class="btn btn-primary"
                    title="儲存"
                    disabled
                  >
                    儲存
                  </button>
                </div>
                <!--form_table end-->
              </div>
              <!--main content end-->
            </div>

            <!--footer start-->
            <script>
              $.include("blocks/footer.html");
            </script>
            <!--footer end-->
          </div>
          <!--main_con end-->
        </div>
      </div>
    </div>

    <div id="kt_scrolltop" class="scrolltop" data-kt-scrolltop="true">
      <i class="ki-duotone ki-arrow-up">
        <span class="path1"></span>
        <span class="path2"></span>
      </i>
    </div>

    <script src="js/plugins.bundle.js"></script>
    <script src="js/scripts.bundle.js"></script>
    <script src="js/main_popover.js"></script>
  </body>
</html>
