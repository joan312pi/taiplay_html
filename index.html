		})

	<!--index_service 下拉切換 start-->
	<script>
		$('select').on('change', function() {
        // 1. 取得目前選取的值與元素對象
        var selectedValue = $(this).val();
        var $this = $(this);

        // 2. 如果目前這個 select 是多選 (multiple)，通常不需要觸發顯示下一層的邏輯
        //    或者我們不希望它隱藏掉自己，所以我們在這裡做個判斷。
        if ($this.prop('multiple')) {
            return; // 如果是多選，選取時不做任何切換動作
        }

        // 3. 隱藏邏輯：當父層改變時，隱藏「後面」所有的子選單
        // nextAll 會尋找同層級之後的所有元素，確保不會影響到自己
        $this.nextAll('.sub-select').css('cssText', 'display: none !important').val('');

        // 4. 顯示邏輯：顯示對應的下一層
        if (selectedValue) {
            // 使用 cssText 強制覆蓋 inline style 的 !important
            $('.' + selectedValue).css('cssText', 'display: inline-block !important');
        }
    });
	</script>
