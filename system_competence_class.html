<!DOCTYPE html>
<html lang="zh-hant-tw">

<head>
    <title>TaiPlay後台管理系統</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="img/favicon.ico" />
    <link href="css/datatables.bundle.css" rel="stylesheet" type="text/css" />
    <link href="css/plugins.bundle.css" rel="stylesheet" type="text/css" />
    <link href="css/style.bundle.css" rel="stylesheet" type="text/css" />
    <link href="scss/style.css" rel="stylesheet" type="text/css" />
    <!--font icon-->
    <link rel="stylesheet" href="css/all.min.css">
    

    <script src="js/jquery.min.js"></script>
    <script src="js/main.js"></script>
</head>

<body id="kt_app_body" data-kt-app-layout="dark-sidebar" data-kt-app-header-fixed="true"
    data-kt-app-sidebar-enabled="true" data-kt-app-sidebar-fixed="true" data-kt-app-sidebar-hoverable="true"
    data-kt-app-sidebar-push-header="true" data-kt-app-sidebar-push-toolbar="true"
    data-kt-app-sidebar-push-footer="true" data-kt-app-toolbar-enabled="true" class="app-default body_color_01 left_menu_bg">

    <div class="d-flex flex-column flex-root app-root" id="kt_app_root">
        <div class="app-page flex-column flex-column-fluid" id="kt_app_page">

            <!--header start-->
            <script>$.include("blocks/header.html");</script>
            <!--header end-->

            <div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">

                <!--left menu start-->
                <script>$.include("blocks/left_menu.html");</script>
                <!--left menu end-->

                <!--main_con start-->
                <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
                    <div class="d-flex flex-column flex-column-fluid">

                        <!--page_title star-->
                        <div id="kt_app_toolbar" class="app-toolbar py-3">
                            <div id="kt_app_toolbar_container" class="app-container  container-xxl d-flex flex-stack ">

                                <!--title start-->
                                <div class="page-title d-flex flex-column justify-content-center flex-wrap me-3 ">

                                    <!--breadcrumb start-->
                                    <ul class="breadcrumb breadcrumb-separatorless  my-0 py-1">
                                        <li class="breadcrumb-item">
                                            <a href="index.html">首頁</a>
                                        </li>
                                        <li class="breadcrumb-item">系統管理</li>
                                    </ul>
                                    <!--breadcrumb end-->

                                    <h2 class="page-heading d-flex flex-column justify-content-center my-0">權限管理</h2>

                                </div>
                                <!--title end-->

                            </div>

                        </div>
                        <!--page_title end-->

                        <div class="app-container container-xxl pb-10">

                            <!--page_toolbar start-->
                            <div class="page_toolbar app-content mt-1 mb-4">
                                <div class="d-flex flex-wrap flex-stack">

                                    <!--page_set start-->
                                    <div class="page_set my-1">
                                        <label for="settings">
                                            <div class="title">管理項目</div>
                                            <select class="form-control w-auto form-select" id="settings" onChange="window.location.href=this.value">
                                                <option value="system_competence.html">*權限管理</option>
                                                <option value="system_competence_class.html" selected>*群組管理</option>
                                                <option value="system_competence_password.html">*密碼原則設定</option>
                                            </select>
                                        </label>
                                    </div>
                                    <!--page_set end-->

                                    <!--page_btn start-->
                                    <div class="page_btn flex-wrap my-1 ms-auto">
                                        <div class="m-0">
                                            <button type="submit" class="btn btn-success" title="新增" onclick="location.href='system_competence_class_edit.html'">
                                                <!-- *新增 -->
                                                <i class="fa-solid fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <!--page_btn end-->
                                </div>
                            </div>
                            <!--page_toolbar end-->

                            <!--page_table start-->
                            <div class="page_table rounded border border-gray-300">
                                <div class="table-responsive">
                                    <table class="table table-hover table-row-bordered table-row-gray-300 gy-2">
                                        <thead>
                                            <tr class="fw-bold">
                                                <th class="text-center" width="50"><input class="form-check-input" type="checkbox"></th>
                                                <th width="190">排序</th>
                                                <th>群組名稱</th>
                                                <th width="60">帳號數</th>
                                                <th class="text-center" width="50">啟用</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td class="text-center"><input class="form-check-input" type="checkbox"></td>
                                                <td class="sorting_btn">
                                                    <button type="button" class="btn btn-default btn-xs">
                                                        <i class="ki-solid ki-double-up"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-default btn-xs">
                                                        <i class="ki-solid ki-up"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-default btn-xs">
                                                        <i class="ki-solid ki-down"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-default btn-xs">
                                                        <i class="ki-solid ki-double-down"></i>
                                                    </button>
                                                    <input type="text" value="1" class="form-control d-inline-block w-50px">
                                                </td>
                                                <td><a href="system_competence_class_edit.html">*總管理者</a></td>
                                                <td class="text-right">1</td>
                                                <td class="text-center"><input class="form-check-input" type="checkbox"></td>
                                            </tr>
                                            <tr>
                                                <td class="text-center"><input class="form-check-input" type="checkbox"></td>
                                                <td class="sorting_btn">
                                                    <button type="button" class="btn btn-default btn-xs">
                                                        <i class="ki-solid ki-double-up"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-default btn-xs">
                                                        <i class="ki-solid ki-up"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-default btn-xs">
                                                        <i class="ki-solid ki-down"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-default btn-xs">
                                                        <i class="ki-solid ki-double-down"></i>
                                                    </button>
                                                    <input type="text" value="2" class="form-control d-inline-block w-50px">
                                                </td>
                                                <td><a href="system_competence_class_edit.html">管理者</a></td>
                                                <td class="text-right">10</td>
                                                <td class="text-center"><input class="form-check-input" type="checkbox"></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <!--page_table end-->

                            <!--pagination start-->
                            <script>$.include("blocks/pagination.html");</script>
                            <!--pagination end-->
                            
                        </div>

                    </div>

                    <!--footer start-->
                    <script>$.include("blocks/footer.html");</script>
                    <!--footer end-->

                </div>
                <!--main_con end-->

            </div>
        </div>
    </div>

    <div id="kt_scrolltop" class="scrolltop" data-kt-scrolltop="true">
        <i class="ki-duotone ki-arrow-up">
            <span class="path1"></span>
            <span class="path2"></span>
        </i>
    </div>

    <script src="js/plugins.bundle.js"></script>
    <script src="js/scripts.bundle.js"></script>
    <script src="js/datatables.bundle.js"></script>
</body>

</html>
