<script>
    document.addEventListener("DOMContentLoaded", function () {
        const selected = document.querySelector(".select-selected");
        const items = document.querySelector(".select-items");
        const tabContent = document.querySelectorAll(".tab_menu");

        // 點擊選單展開選項
        selected.addEventListener("click", function () {
            items.classList.toggle("open");
            selected.classList.toggle("show","active");
        });

        // 點擊選項時，切換選擇的內容和對應 tab
        items.querySelectorAll("div").forEach(option => {
            option.addEventListener("click", function () {
                const selectedValue = this.getAttribute("data-value");

                // 更新選單顯示的文字
                selected.textContent = this.textContent;
                selected.setAttribute("data-value", selectedValue);

                // 切換對應的 tab_menu 顯示
                tabContent.forEach(tab => {
                    if (tab.id === selectedValue) {
                        tab.classList.add("show","active");
                    } else {
                        tab.classList.remove("show","active");
                    }
                });

                // 關閉選單
                items.classList.remove("open");
                selected.classList.remove("active");
            });
        });

        // 點擊外部時關閉選單
        document.addEventListener("click", function (e) {
            if (!selected.contains(e.target) && !items.contains(e.target)) {
                items.classList.remove("open");
                selected.classList.remove("active");
            }
        });
    });
</script>
