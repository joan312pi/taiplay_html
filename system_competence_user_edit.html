    <!--複製密碼連結 start-->
    <script>
        $(document).ready(function() {
            // 監聽所有具備特定用途的 copy-link 點擊事件
            // 建議在 HTML 加入一個 class 例如 'copy-btn'
            $('a[data-bs-content="複製密碼連結"]').on('click', function(e) {
                e.preventDefault(); // 阻止網頁跳轉到該連結

                const urlToCopy = $(this).attr('href'); // 取得 href 網址
                const $this = $(this);

                // 執行複製到剪貼簿
                navigator.clipboard.writeText(urlToCopy).then(function() {
                    // --- 複製成功後的視覺回饋 ---
                    
                    // 1. 取得舊的 Popover 內容
                    const originalContent = $this.attr('data-bs-content');

                    // 2. 更新 Popover 內容為「已複製！」
                    $this.attr('data-bs-content', '已複製！');
                    
                    // 3. 重新顯示 Popover 以反映新內容
                    const popover = bootstrap.Popover.getInstance($this[0]);
                    if (popover) {
                        popover.setContent({
                            '.popover-body': '已複製！'
                        });
                    }

                    // 4. 設定 1.5 秒後關閉並還原
                    setTimeout(function() {
                        popover.hide(); // 關閉 Popover

                        // 在隱藏後，悄悄把文字改回原始設定，以便下次滑過時顯示正確
                        setTimeout(function() {
                            $this.attr('data-bs-content', originalContent);
                            popover.setContent({
                                '.popover-body': originalContent
                            });
                        }, 200); // 稍微延遲還原文字，避免使用者在關閉動畫中看到文字變換
                        
                    }, 1500);

                }).catch(function(err) {
                    console.error('無法複製文字: ', err);
                });
            });
        });
    </script>
