<!doctype html>
<html lang="zh-hant-tw">
  <head>
    <title>TaiPlay後台管理系統</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="img/favicon.ico" />
    <link href="css/datatables.bundle.css" rel="stylesheet" type="text/css" />
    <link href="css/plugins.bundle.css" rel="stylesheet" type="text/css" />
    <link href="css/style.bundle.css" rel="stylesheet" type="text/css" />
    <link href="scss/style.css" rel="stylesheet" type="text/css" />
    <!--font icon-->
    <link rel="stylesheet" href="css/all.min.css" />

    <script src="js/jquery.min.js"></script>
    <script src="js/main.js"></script>
  </head>

  <body
    id="kt_app_body"
    data-kt-app-layout="dark-sidebar"
    data-kt-app-header-fixed="true"
    data-kt-app-sidebar-enabled="true"
    data-kt-app-sidebar-fixed="true"
    data-kt-app-sidebar-hoverable="true"
    data-kt-app-sidebar-push-header="true"
    data-kt-app-sidebar-push-toolbar="true"
    data-kt-app-sidebar-push-footer="true"
    data-kt-app-toolbar-enabled="true"
    class="app-default body_color_01 left_menu_bg"
  >
    <div class="d-flex flex-column flex-root app-root" id="kt_app_root">
      <div class="app-page flex-column flex-column-fluid" id="kt_app_page">
        <!--header start-->
        <script>
          $.include("blocks/header.html");
        </script>
        <!--header end-->

        <div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
          <!--left menu start-->
          <script>
            $.include("blocks/left_menu.html");
          </script>
          <!--left menu end-->

          <!--main_con start-->
          <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
            <div class="d-flex flex-column flex-column-fluid">
              <!--main content start-->

              <!--page_title star-->
              <div id="kt_app_toolbar" class="app-toolbar py-3">
                <div
                  id="kt_app_toolbar_container"
                  class="app-container container-xxl d-flex flex-stack"
                >
                  <!--title start-->
                  <div
                    class="page-title d-flex flex-column justify-content-center flex-wrap me-3"
                  >
                    <!--breadcrumb start-->
                    <ul class="breadcrumb breadcrumb-separatorless my-0 py-1">
                      <li class="breadcrumb-item">
                        <a href="index.html">首頁</a>
                      </li>
                      <li class="breadcrumb-item">系統管理</li>
                    </ul>
                    <!--breadcrumb end-->

                    <h2
                      class="page-heading d-flex flex-column justify-content-center my-0"
                    >
                      密碼原則設定
                    </h2>
                  </div>
                  <!--title end-->
                </div>
              </div>
              <!--page_title end-->

              <div class="app-container container-xxl pb-10">
                <!--form_table start-->
                <div class="form_table rounded border border-gray-300">
                  <div class="row">
                    <div class="col-md-2 col-form-label">
                      密碼組成規則
                      <i
                        class="fa-solid fa-circle-info"
                        data-bs-placement="bottom"
                        data-bs-toggle="popover"
                        data-bs-trigger="hover focus"
                        data-bs-html="true"
                        data-bs-content="建議全部勾選"
                      ></i>
                    </div>
                    <div class="col-md-10 form_font">
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          checked
                        />大寫字母（A-Z）
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          checked
                        />小寫字母（a-z）
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          checked
                        />數字（0-9）
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          checked
                        />特殊符號（如：!@#$%^&*）
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          checked
                        />連續英文字、相同英文字
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          checked
                        />連號數字、相同數字
                      </label>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label">
                      密碼長度
                      <i
                        class="fa-solid fa-circle-info"
                        data-bs-placement="bottom"
                        data-bs-toggle="popover"
                        data-bs-trigger="hover focus"
                        data-bs-html="true"
                        data-bs-content="建議長度在10~64字元"
                      ></i>
                    </div>
                    <div class="col-md-10 form_font">
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_05"
                          data-toggle="toggle_05_01"
                          onclick="toggleChoice('toggle_item_05')"
                        />關閉
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_05"
                          data-toggle="toggle_05_02"
                          onclick="toggleChoice('toggle_item_05')"
                          checked=""
                        />開啟
                      </label>
                      <span class="d-inline-block">
                        <div class="toggle_05_02">
                          <input
                            type="number"
                            class="form-control w-60px d-inline-block"
                            min="10"
                            placeholder="最小"
                            value="10"
                          />
                          ~
                          <input
                            type="number"
                            class="form-control w-60px d-inline-block"
                            min="10"
                            max="64"
                            placeholder="最大"
                            value="64"
                          />
                          字元 (最大長度64字元)
                        </div>
                      </span>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label">
                      密碼有效期限
                      <i
                        class="fa-solid fa-circle-info"
                        data-bs-placement="bottom"
                        data-bs-toggle="popover"
                        data-bs-trigger="hover focus"
                        data-bs-html="true"
                        data-bs-content="建議有效期限為180天，提前10天提醒"
                      ></i>
                    </div>
                    <div class="col-md-10 form_font">
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_03"
                          data-toggle="toggle_03_01"
                          onclick="toggleChoice('toggle_item_03')"
                        />關閉
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_03"
                          data-toggle="toggle_03_02"
                          onclick="toggleChoice('toggle_item_03')"
                          checked=""
                        />開啟
                      </label>
                      <div class="toggle_03_02">
                        <input
                          type="number"
                          class="form-control w-70px d-inline-block"
                          value="180"
                        />
                        天有效期，提前
                        <input
                          type="number"
                          class="form-control w-60px d-inline-block"
                          value="10"
                        />
                        天到期提醒，通知用戶變更密碼，<br />
                        密碼到期後，<input
                          type="number"
                          class="form-control w-70px d-inline-block"
                          value="15"
                        />
                        天內必須更改密碼，否則帳號將被鎖定。
                        <!-- <label class="form-cheak-label">
                                                <input class="form-check-input" type="checkbox">可延用現有密碼 
                                            </label> -->
                      </div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label">
                      密碼重複使用限制
                      <i
                        class="fa-solid fa-circle-info"
                        data-bs-placement="bottom"
                        data-bs-toggle="popover"
                        data-bs-trigger="hover focus"
                        data-bs-html="true"
                        data-bs-content="建議限制最近3次"
                      ></i>
                    </div>
                    <div class="col-md-10 form_font">
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_02"
                          data-toggle="toggle_02_01"
                          onclick="toggleChoice('toggle_item_02')"
                        />關閉（可延用舊密碼）
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_02"
                          data-toggle="toggle_02_02"
                          onclick="toggleChoice('toggle_item_02')"
                          checked=""
                        />開啟
                      </label>
                      <span class="d-inline-block">
                        <div class="toggle_02_02">
                          最近
                          <input
                            type="number"
                            class="form-control w-60px d-inline-block"
                            value="3"
                          />
                          次內不可重複
                        </div>
                      </span>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label">
                      錯誤登入次數限制
                      <i
                        class="fa-solid fa-circle-info"
                        data-bs-placement="bottom"
                        data-bs-toggle="popover"
                        data-bs-trigger="hover focus"
                        data-bs-html="true"
                        data-bs-content="建議限制錯誤登入5次後鎖定帳號，<br>等待15分鐘後自動解鎖，<br>累計錯誤15次後鎖定帳號"
                      ></i>
                    </div>
                    <div class="col-md-10 form_font">
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_04"
                          data-toggle="toggle_04_01"
                          onclick="toggleChoice('toggle_item_04')"
                        />關閉
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_04"
                          data-toggle="toggle_04_02"
                          onclick="toggleChoice('toggle_item_04')"
                          checked=""
                        />開啟
                      </label>
                      <br />
                      <span class="d-inline-block">
                        <div class="toggle_04_02">
                          重覆登入
                          <input
                            type="number"
                            class="form-control w-60px d-inline-block"
                            value="5"
                          />
                          次錯誤後鎖定帳號，等待
                          <input
                            type="number"
                            class="form-control w-60px d-inline-block"
                            value="15"
                          />
                          分鐘後自動解鎖， 累計錯誤
                          <input
                            type="number"
                            class="form-control w-60px d-inline-block"
                            value="15"
                          />
                          次後鎖定帳號，需管理員手動解鎖
                        </div>
                      </span>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label">
                      多因素驗證(MFA)
                      <i
                        class="fa-solid fa-circle-info"
                        data-bs-placement="bottom"
                        data-bs-toggle="popover"
                        data-bs-trigger="hover focus"
                        data-bs-html="true"
                        data-bs-content="建議啟用"
                      ></i>
                    </div>
                    <div class="col-md-10 form_font">
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_08"
                          data-toggle="toggle_08_01"
                          onclick="toggleChoice('toggle_item_08')"
                        />關閉
                      </label>
                      <label class="form-cheak-label">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="toggle_item_08"
                          data-toggle="toggle_08_02"
                          onclick="toggleChoice('toggle_item_08')"
                          checked=""
                        />開啟 <span class="toggle_08_02">mail驗證</span>
                      </label>
                      <!-- <div class="toggle_08_02">
                                            <label class="form-cheak-label">
                                                <input class="form-check-input" type="radio" name="radio_01">Google Authenticator
                                            </label>
                                            <label class="form-cheak-label">
                                                <input class="form-check-input" type="radio" name="radio_01" checked>mail驗證
                                            </label>
                                            <label class="form-cheak-label"> 
                                                <input class="form-check-input" type="radio" name="radio_01">簡訊驗證
                                            </label>
                                        </div> -->
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-2 col-form-label">
                      自動安全登出
                      <i
                        class="fa-solid fa-circle-info"
                        data-bs-placement="bottom"
                        data-bs-toggle="popover"
                        data-bs-trigger="hover focus"
                        data-bs-html="true"
                        data-bs-content="建議30分鐘"
                      ></i>
                    </div>
                    <div class="col-md-10 form_font">
                      <!-- <label class="form-cheak-label">
                                            <input class="form-check-input" type="radio" name="toggle_item_06" data-toggle="toggle_06_01" onclick="toggleChoice('toggle_item_06');" checked="">關閉
                                        </label>
                                        <label class="form-cheak-label">
                                            <input class="form-check-input" type="radio" name="toggle_item_06" data-toggle="toggle_06_02" onclick="toggleChoice('toggle_item_06');">開啟
                                        </label> -->
                      <span class="d-inline-block">
                        <div class="toggle_06_02">
                          未活動
                          <input
                            type="number"
                            class="form-control w-60px d-inline-block"
                            value="30"
                          />
                          分鐘後自動登出
                        </div>
                      </span>
                    </div>
                  </div>
                </div>
                <!--form_table end-->

                <div class="btn_box pb-0">
                  <button type="submit" class="btn btn-primary" title="儲存">
                    儲存
                  </button>
                </div>
              </div>
              <!--main content end-->
            </div>

            <!--footer start-->
            <script>
              $.include("blocks/footer.html");
            </script>
            <!--footer end-->
          </div>
          <!--main_con end-->
        </div>
      </div>
    </div>

    <div id="kt_scrolltop" class="scrolltop" data-kt-scrolltop="true">
      <i class="ki-duotone ki-arrow-up">
        <span class="path1"></span>
        <span class="path2"></span>
      </i>
    </div>

    <script src="js/plugins.bundle.js"></script>
    <script src="js/scripts.bundle.js"></script>
    <script src="js/datatables.bundle.js"></script>
  </body>
</html>
