<!doctype html>
<html lang="zh-hant-tw">
  <head>
    <title>TaiPlay後台管理系統</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="img/favicon.ico" />
    <link href="css/datatables.bundle.css" rel="stylesheet" type="text/css" />
    <link href="css/plugins.bundle.css" rel="stylesheet" type="text/css" />
    <link href="css/style.bundle.css" rel="stylesheet" type="text/css" />
    <link href="scss/style.css" rel="stylesheet" type="text/css" />
    <!--font icon-->
    <link rel="stylesheet" href="css/all.min.css" />

    <script src="js/jquery.min.js"></script>
    <script src="js/main.js"></script>

  <body
    id="kt_app_body"
    data-kt-app-layout="dark-sidebar"
    data-kt-app-header-fixed="true"
    data-kt-app-sidebar-enabled="true"
    data-kt-app-sidebar-fixed="true"
    data-kt-app-sidebar-hoverable="true"
    data-kt-app-sidebar-push-header="true"
    data-kt-app-sidebar-push-toolbar="true"
    data-kt-app-sidebar-push-footer="true"
    data-kt-app-toolbar-enabled="true"
    class="app-default body_color_01 left_menu_bg"
  >
    <div class="d-flex flex-column flex-root app-root" id="kt_app_root">
      <div class="app-page flex-column flex-column-fluid" id="kt_app_page">
        <!--header start-->
        <script>
          $.include("blocks/header.html");
        </script>
        <!--header end-->

        <div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
          <!--left menu start-->
          <script>
            $.include("blocks/left_menu.html");
          </script>
          <!--left menu end-->

          <!--main_con start-->
          <div class="app-main flex-column flex-row-fluid" id="kt_app_main">
            <div class="d-flex flex-column flex-column-fluid">
              <!--main content start-->

              <!--page_title star-->
              <div id="kt_app_toolbar" class="app-toolbar py-3">
                <div
                  id="kt_app_toolbar_container"
                  class="app-container container-xxl d-flex flex-stack"
                >
                  <!--title start-->
                  <div
                    class="page-title d-flex flex-column justify-content-center flex-wrap me-3"
                  >
                    <!--breadcrumb start-->
                    <ul class="breadcrumb breadcrumb-separatorless my-0 py-1">
                      <li class="breadcrumb-item">
                        <a href="index.html">首頁</a>
                      </li>
                      <li class="breadcrumb-item">行程管理</li>
                    </ul>
                    <!--breadcrumb end-->

                    <h2
                      class="page-heading d-flex flex-column justify-content-center my-0"
                    >
                      記帳管理
                    </h2>
                  </div>
                  <!--title end-->
                </div>
              </div>
              <!--page_title end-->

              <div class="app-container container-xxl pb-10">
                <!--tab menu start-->
                <nav>
                  <div class="nav nav-tabs" id="nav-tab" role="tablist">
                    <button
                      class="nav-link hvr-overline-from-center"
                      type="button"
                      onclick="location.href = 'trip_expense.html'"
                    >
                      檢視帳務
                    </button>
                    <button
                      class="nav-link hvr-overline-from-center active"
                      type="button"
                      onclick="location.href = 'trip_expense_type.html'"
                    >
                      費用分類管理
                    </button>
                  </div>
                </nav>
                <!--tab menu end-->

                <!--page_toolbar start-->
                <div class="page_toolbar app-content mt-1 mb-4">
                  <div class="d-flex flex-wrap flex-stack">
                    <!--page_btn start-->
                    <div class="page_btn flex-wrap my-1 ms-auto">
                      <div class="m-0">
                        <button
                          type="submit"
                          class="btn btn-success"
                          title="新增"
                          onclick="
                            location.href = 'trip_expense_type_edit.html'
                          "
                        >
                          <i class="fa-solid fa-plus"></i>
                        </button>
                        <button
                          type="submit"
                          class="btn btn-danger"
                          title="刪除"
                        >
                          <i class="fa-solid fa-trash-can"></i>
                        </button>
                      </div>
                    </div>
                    <!--page_btn end-->
                  </div>
                </div>
                <!--page_toolbar end-->

                <!--page_table start-->
                <div class="page_table rounded border border-gray-300">
                  <div class="table-responsive">
                    <table
                      class="table table-hover table-row-bordered table-row-gray-300 gy-2"
                    >
                      <thead>
                        <tr class="fw-bold">
                          <th class="text-center" width="50">
                            <input class="form-check-input" type="checkbox" />
                          </th>
                          <th width="190">排序</th>
                          <th>標題</th>
                          <th class="text-center" width="70">啟用</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td class="text-center">
                            <input class="form-check-input" type="checkbox" />
                          </td>
                          <td class="sorting_btn">
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-double-up"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-up"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-down"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-double-down"></i>
                            </button>
                            <input
                              type="text"
                              value="1"
                              class="form-control d-inline-block w-50px"
                            />
                          </td>
                          <td>
                            <a href="trip_expense_type_edit.html">餐飲</a>
                          </td>
                          <td class="text-center">
                            <!-- <input class="form-check-input" type="checkbox"> -->
                            <div
                              class="form-check form-switch form-check-solid"
                            >
                              <input
                                type="checkbox"
                                class="form-check-input status-popover-toggle status-popover-input2"
                                data-bs-placement="bottom"
                                data-bs-toggle="popover"
                                data-bs-trigger="hover"
                                data-bs-html="true"
                                data-bs-content="啟用開啟"
                                checked
                              />
                            </div>
                          </td>
                        </tr>
                        <tr>
                          <td class="text-center">
                            <input class="form-check-input" type="checkbox" />
                          </td>
                          <td class="sorting_btn">
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-double-up"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-up"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-down"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-double-down"></i>
                            </button>
                            <input
                              type="text"
                              value="2"
                              class="form-control d-inline-block w-50px"
                            />
                          </td>
                          <td>
                            <a href="trip_expense_type_edit.html">交通</a>
                          </td>

                          <td class="text-center">
                            <!-- <input class="form-check-input" type="checkbox"> -->
                            <div
                              class="form-check form-switch form-check-solid"
                            >
                              <input
                                type="checkbox"
                                class="form-check-input status-popover-toggle status-popover-input2"
                                data-bs-placement="bottom"
                                data-bs-toggle="popover"
                                data-bs-trigger="hover"
                                data-bs-html="true"
                                data-bs-content="啟用開啟"
                                checked
                              />
                            </div>
                          </td>
                        </tr>
                        <tr>
                          <td class="text-center">
                            <input class="form-check-input" type="checkbox" />
                          </td>
                          <td class="sorting_btn">
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-double-up"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-up"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-down"></i>
                            </button>
                            <button
                              type="button"
                              class="btn btn-default btn-xs"
                            >
                              <i class="ki-solid ki-double-down"></i>
                            </button>
                            <input
                              type="text"
                              value="3"
                              class="form-control d-inline-block w-50px"
                            />
                          </td>
                          <td>
                            <a href="trip_expense_type_edit.html">住宿</a>
                          </td>
                          <td class="text-center">
                            <!-- <input class="form-check-input" type="checkbox"> -->
                            <div
                              class="form-check form-switch form-check-solid"
                            >
                              <input
                                type="checkbox"
                                class="form-check-input status-popover-toggle status-popover-input2"
                                data-bs-placement="bottom"
                                data-bs-toggle="popover"
                                data-bs-trigger="hover"
                                data-bs-html="true"
                                data-bs-content="啟用開啟"
                                checked
                              />
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                <!--page_table end-->

                <!--pagination start-->
                <script>
                  $.include("blocks/pagination.html");
                </script>
                <!--pagination end-->
              </div>
              <!--main content end-->
            </div>

            <!--footer start-->
            <script>
              $.include("blocks/footer.html");
            </script>
            <!--footer end-->
          </div>
          <!--main_con end-->
        </div>
      </div>
    </div>

    <div id="kt_scrolltop" class="scrolltop" data-kt-scrolltop="true">
      <i class="ki-duotone ki-arrow-up">
        <span class="path1"></span>
        <span class="path2"></span>
      </i>
    </div>

    <script src="js/plugins.bundle.js"></script>
    <script src="js/scripts.bundle.js"></script>
    <script src="js/main_popover.js"></script>

    <!-- Modal start-->
    <div
      class="modal fade"
      id="trip_Split_modal"
      tabindex="-1"
      aria-labelledby="edit_label"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <div class="modal-title" id="edit_label">檢視分帳明細</div>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="page_group w-75px">
              <div class="item">
                <div class="title">分帳方式</div>
                <div class="input_font input-auto">均分</div>
              </div>
              <div class="item">
                <div class="title">總金額</div>
                <div class="input_font input-auto">3680</div>
              </div>
              <div class="item">
                <div class="title">墊付明細</div>
                <div class="input_font input-auto">
                  王小明：2000<br />
                  林小華：1680
                </div>
              </div>
              <div class="item">
                <div class="title">待付明細</div>
                <div class="input_font input-auto">林小華：160 付給 王小明</div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              確認
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal end-->
  </body>
</html>
